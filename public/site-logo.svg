<svg viewBox="0 0 320 320" width="512" height="512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="angelWingsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="fireCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </radialGradient>
    <radialGradient id="haloGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>
  </defs>

  <!-- Crisp White Circular Badge Disc -->
  <circle cx="160" cy="160" r="154" fill="#ffffff" stroke="#1d4ed8" stroke-width="6" />
  <circle cx="160" cy="130" r="105" stroke="#1d4ed8" stroke-width="4" opacity="0.85" />
  <circle cx="160" cy="130" r="100" stroke="#0284c7" stroke-width="1.8" opacity="0.55" />

  <!-- Fiery Furnace Flames behind the youths -->
  <path 
    d="M 90 170 C 80 135, 110 100, 125 110 C 135 85, 150 70, 160 55 C 170 70, 185 85, 195 110 C 210 100, 240 135, 230 170 C 215 195, 105 195, 90 170 Z" 
    fill="url(#fireCenter)" 
  />
  <path 
    d="M 115 160 C 110 130, 130 110, 140 115 C 150 95, 160 80, 160 70 C 160 80, 170 95, 180 115 C 190 110, 210 130, 205 160 Z" 
    fill="#fde047" 
    opacity="0.9"
  />

  <!-- Divine Angel Halo & Head -->
  <ellipse cx="160" cy="38" rx="14" ry="5" fill="none" stroke="url(#haloGold)" stroke-width="3" />
  <circle cx="160" cy="48" r="9" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" />

  <!-- Left Wing -->
  <path 
    d="M 155 48 C 130 40, 95 60, 75 90 C 70 100, 68 115, 66 128 C 72 125, 78 115, 82 105 C 80 120, 84 135, 92 145 C 96 135, 100 120, 105 105 C 112 120, 120 135, 130 142 C 130 125, 132 100, 145 75 Z" 
    fill="url(#angelWingsGrad)" 
    stroke="#38bdf8" 
    stroke-width="1.8" 
  />
  <!-- Right Wing -->
  <path 
    d="M 165 48 C 190 40, 225 60, 245 90 C 250 100, 252 115, 254 128 C 248 125, 242 115, 238 105 C 240 120, 236 135, 228 145 C 224 135, 220 120, 215 105 C 208 120, 200 135, 190 142 C 190 125, 188 100, 175 75 Z" 
    fill="url(#angelWingsGrad)" 
    stroke="#38bdf8" 
    stroke-width="1.8" 
  />

  <!-- 1. Left Youth (In Green) -->
  <g id="left-youth">
    <path d="M 100 170 C 105 155, 118 152, 130 155 L 132 205 L 95 205 Z" fill="#15803d" stroke="#166534" stroke-width="1.5" />
    <path d="M 108 156 L 115 175 L 122 156" stroke="#14532d" stroke-width="1.5" fill="none" />
    <ellipse cx="120" cy="138" rx="9" ry="11" fill="#fed7aa" />
    <path d="M 112 135 C 112 127, 124 125, 128 130 C 130 134, 128 140, 127 142 Z" fill="#0f172a" />
  </g>

  <!-- 2. Right Youth (In Green) -->
  <g id="right-youth">
    <path d="M 220 170 C 215 155, 202 152, 190 155 L 188 205 L 225 205 Z" fill="#15803d" stroke="#166534" stroke-width="1.5" />
    <path d="M 212 156 L 205 175 L 198 156" stroke="#14532d" stroke-width="1.5" fill="none" />
    <ellipse cx="200" cy="138" rx="9" ry="11" fill="#fed7aa" />
    <path d="M 208 135 C 208 127, 196 125, 192 130 C 190 134, 192 140, 193 142 Z" fill="#0f172a" />
  </g>

  <!-- 3. Center Youth (Prominent in Blue) -->
  <g id="center-youth">
    <path d="M 135 160 C 145 150, 175 150, 185 160 L 188 215 L 132 215 Z" fill="#2563eb" stroke="#1d4ed8" stroke-width="2" />
    <path d="M 150 153 L 160 172 L 170 153" stroke="#1e40af" stroke-width="2" fill="none" />
    <line x1="138" y1="188" x2="182" y2="188" stroke="#1d4ed8" stroke-width="3" />
    <rect x="154" y="142" width="12" height="12" fill="#fed7aa" />
    <ellipse cx="160" cy="132" rx="12" ry="14" fill="#fde68a" stroke="#f59e0b" stroke-width="0.5" />
    <path d="M 156 128 Q 159 125 163 128" stroke="#78350f" stroke-width="1.2" fill="none" />
    <circle cx="160" cy="130" r="1" fill="#78350f" />
    <path d="M 148 130 C 148 116, 164 114, 172 122 C 174 128, 170 135, 168 137 Z" fill="#0f172a" />
  </g>

  <!-- Arabic meeting logo typography -->
  <text 
    x="160" 
    y="258" 
    text-anchor="middle" 
    fill="#0369a1" 
    font-size="28" 
    font-weight="bold"
    font-family="Noto Kufi Arabic, Noto Sans Arabic, Cairo, DejaVu Sans, sans-serif"
  >الثلاثة فتية</text>

  <text 
    x="160" 
    y="286" 
    text-anchor="middle" 
    fill="#0f766e" 
    font-size="15" 
    font-weight="bold"
    font-family="Noto Kufi Arabic, Noto Sans Arabic, Cairo, DejaVu Sans, sans-serif"
  >اجتماع الشباب السوداني</text>
</svg>
