    <!-- Suppress Vite Dev WebSocket / HMR & Third-Party OneSignal Domain-Mismatch Rejections -->
    <script>
      (function() {
        try {
          var NativeWebSocket = window.WebSocket;
          if (NativeWebSocket) {
            window.WebSocket = function(url, protocols) {
              if (
                protocols === 'vite-hmr' || 
                (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('@vite') !== -1))
              ) {
                return {
                  readyState: 3,
                  binaryType: 'blob',
                  bufferedAmount: 0,
                  extensions: '',
                  protocol: 'vite-hmr',
                  url: url,
                  send: function() {},
                  close: function() {},
                  addEventListener: function() {},
                  removeEventListener: function() {},
                  dispatchEvent: function() { return false; },
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null
                };
              }
              return new NativeWebSocket(url, protocols);
            };
            window.WebSocket.prototype = NativeWebSocket.prototype;
            window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
            window.WebSocket.OPEN = NativeWebSocket.OPEN;
            window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
            window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
          }
        } catch (e) {}

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = reason ? (reason.message || String(reason)) : '';
          var stack = reason ? (reason.stack || '') : '';
          var isPlainObject = reason && typeof reason === 'object' && !(reason instanceof Error);
          if (
            isPlainObject ||
            msg.indexOf('WebSocket') !== -1 || 
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('closed without opened') !== -1 ||
            msg.indexOf('OneSignal') !== -1 ||
            msg.indexOf('ServiceWorker') !== -1 ||
            stack.indexOf('@vite/client') !== -1 ||
            stack.indexOf('onesignal') !== -1 ||
            stack.indexOf('OneSignal') !== -1
          ) {
            event.preventDefault();
            event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event && event.message ? event.message : '';
          var filename = event && event.filename ? event.filename : '';
          if (
            msg.indexOf('WebSocket') !== -1 || 
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('closed without opened') !== -1 ||
            filename.indexOf('@vite/client') !== -1 ||
            filename.indexOf('onesignal') !== -1
          ) {
            event.preventDefault();
            event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return false;
          }
        }, true);

        var origError = console.error;
        console.error = function() {
          var str = Array.prototype.slice.call(arguments).map(function(a) { return String(a || ''); }).join(' ');
          if (
            str.indexOf('WebSocket') !== -1 || 
            str.indexOf('websocket') !== -1 || 
            str.indexOf('closed without opened') !== -1 ||
            str.indexOf('[vite]') !== -1 || 
            str.indexOf('@vite/client') !== -1 ||
            str.indexOf('OneSignal') !== -1
          ) {
            return;
          }
          origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          var str = Array.prototype.slice.call(arguments).map(function(a) { return String(a || ''); }).join(' ');
          if (
            str.indexOf('WebSocket') !== -1 || 
            str.indexOf('websocket') !== -1 || 
            str.indexOf('closed without opened') !== -1 ||
            str.indexOf('[vite]') !== -1 || 
            str.indexOf('@vite/client') !== -1 ||
            str.indexOf('OneSignal') !== -1
          ) {
            return;
          }
          origWarn.apply(console, arguments);
        };
      })();
    </script>

    <!-- Web Push Service Worker & OneSignal SDK (Android & iPhone iOS PWA) -->

    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];

      window.__oneSignalInitPromise = new Promise(function(resolve) {
        OneSignalDeferred.push(async function(OneSignal) {
          try {
            await OneSignal.init({
              appId: "195c5a47-9662-45ce-886a-e048636af0c1",
              safari_web_id: "web.onesignal.auto.195c5a47-9662-45ce-886a-e048636af0c1",
              serviceWorkerPath: "OneSignalSDKWorker.js",
              allowLocalhostAsSecureOrigin: true,
            });
            window.__oneSignalReady = true;
            try {
              if (window.Notification && Notification.permission === 'granted' && OneSignal.User && OneSignal.User.PushSubscription) {
                await Promise.resolve(OneSignal.User.PushSubscription.optIn()).catch(function() {});
              } else if (OneSignal.Slidedown && typeof OneSignal.Slidedown.promptPush === 'function') {
                await Promise.resolve(OneSignal.Slidedown.promptPush()).catch(function() {});
              }
            } catch (e) {}
            resolve(true);
          } catch (err) {
            window.__oneSignalReady = false;
            resolve(false);
          }
        });
      });
      if ('serviceWorker' in navigator) {

          navigator.serviceWorker.register('/OneSignalSDKWorker.js', { scope: '/' }).catch(function() {});
