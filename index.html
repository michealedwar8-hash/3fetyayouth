    <script>
      // Intercept any Vite HMR or legacy Supabase WebSocket creation, static API fallbacks, & suppress benign runtime warnings
      (function() {
        var OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          var PatchedWebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            var protoStr = String(protocols || '');
            if (
              protoStr.indexOf('vite-hmr') !== -1 ||
              protoStr.indexOf('vite-ping') !== -1 ||
              urlStr.indexOf(':24678') !== -1 ||
              urlStr.indexOf('token=') !== -1 ||
              urlStr.indexOf('supabase.co') !== -1
            ) {
              var dummy = {
                url: urlStr,
                readyState: 1,
                protocol: protoStr,
                extensions: '',
                bufferedAmount: 0,
                binaryType: 'blob',
                send: function() {},
                close: function() { this.readyState = 3; },
                addEventListener: function(type, cb) {
                  if (type === 'open' && typeof cb === 'function') {
                    setTimeout(function() { try { cb({ type: 'open', target: dummy }); } catch (e) {} }, 0);
                  }
                },
                removeEventListener: function() {},
                dispatchEvent: function() { return true; },
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null
              };
              setTimeout(function() {
                if (typeof dummy.onopen === 'function') {
                  try { dummy.onopen({ type: 'open', target: dummy }); } catch (e) {}
                }
              }, 0);
              return dummy;
            }
            return protocols !== undefined ? new OrigWebSocket(url, protocols) : new OrigWebSocket(url);
          };
          PatchedWebSocket.prototype = OrigWebSocket.prototype;
          PatchedWebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          PatchedWebSocket.OPEN = OrigWebSocket.OPEN;
          PatchedWebSocket.CLOSING = OrigWebSocket.CLOSING;
          PatchedWebSocket.CLOSED = OrigWebSocket.CLOSED;
          window.WebSocket = PatchedWebSocket;
        }

        // Prevent EventSource('/api/events') 404 on static custom domains (e.g. 3fetyayouth.online) where Cloudflare Durable Objects WS is used
        var isStaticCustomDomain = typeof location !== 'undefined' && (
          location.hostname.indexOf('3fetyayouth.online') !== -1 ||
          location.hostname.indexOf('.pages.dev') !== -1
        );
        if (isStaticCustomDomain && window.EventSource) {
          var OrigEventSource = window.EventSource;
          var PatchedEventSource = function(url, config) {
            var u = String(url || '');
            if (u.indexOf('/api/events') !== -1) {
              return {
                url: u,
                readyState: 1,
                withCredentials: false,
                close: function() { this.readyState = 2; },
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() { return true; },
                onopen: null,
                onmessage: null,
                onerror: null
              };
            }
            return new OrigEventSource(url, config);
          };
          PatchedEventSource.prototype = OrigEventSource.prototype;
          PatchedEventSource.CONNECTING = 0;
          PatchedEventSource.OPEN = 1;
          PatchedEventSource.CLOSED = 2;
          window.EventSource = PatchedEventSource;
        }

        // Intercept any accidental supabase.co fetch or static-domain /api/* 404s
        if (window.fetch) {
          var origFetch = window.fetch.bind(window);
          var expressUnavailable = isStaticCustomDomain;
          window.fetch = function(input, init) {
            var urlStr = typeof input === 'string' ? input : (input && input.url ? input.url : String(input || ''));
            if (urlStr.indexOf('supabase.co') !== -1) {
              return Promise.resolve(new Response(JSON.stringify([]), {
                status: 200,
                headers: { 'Content-Type': 'application/json' }
              }));
            }
            if (expressUnavailable && urlStr.indexOf('/api/') === 0) {
              if (urlStr.indexOf('/api/site-texts') === 0) {
                var savedTexts = {};
                try {
                  savedTexts = JSON.parse(localStorage.getItem('three_youths_site_text_overrides_v1') || '{}');
                } catch (e) {}
                return Promise.resolve(new Response(JSON.stringify({
                  success: true,
                  siteTextOverrides: savedTexts
                }), { status: 200, headers: { 'Content-Type': 'application/json' } }));
              }
              return Promise.resolve(new Response(JSON.stringify({
                success: true,
                ok: true
              }), { status: 200, headers: { 'Content-Type': 'application/json' } }));
            }
            return origFetch(input, init).then(function(res) {
              if (!res.ok && res.status === 404 && urlStr.indexOf('/api/') === 0) {
                if (
                  urlStr.indexOf('/api/data') === 0 ||
                  urlStr.indexOf('/api/site-texts') === 0 ||
                  urlStr.indexOf('/api/events') === 0
                ) {
                  expressUnavailable = true;
                }
                return new Response(JSON.stringify({ success: true, ok: true, siteTextOverrides: {} }), {
                  status: 200,
                  headers: { 'Content-Type': 'application/json' }
                });
              }
              return res;
            });
          };
        }

        const isBenignError = function(msg) {
          if (!msg) return false;
          const s = String(msg);
          return s.includes('WebSocket closed without opened') ||
                 s.includes('failed to connect to websocket') ||
                 s.includes('[vite] failed to connect') ||
                 s.includes('Frame with ID 0 was removed') ||
                 s.includes('IndexedDB timed out') ||
                 s.includes('Invalid Refresh Token') ||
                 s.includes('Refresh Token Not Found') ||
                 s.includes('Lock broken by another request') ||
                 s.includes('OneSignal') ||
                 s.includes('ServiceWorker') ||
                 s.includes('Automatically scrolling cursor') ||
                 s.includes('Fallback to REST API') ||
                 s.includes('falling back to REST API') ||
                 s.includes('Realtime send()') ||
                 s.includes('supabase.co');
        };

        window.addEventListener('unhandledrejection', function(event) {
          const msg = event.reason && (event.reason.message || String(event.reason));
          if (isBenignError(msg)) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          const msg = event.message || (event.error && event.error.message);
          if (isBenignError(msg)) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);

        const origError = console.error;
        console.error = function(...args) {
          if (args.some(a => isBenignError(a && (a.message || String(a))))) return;
          origError.apply(console, args);
        };

        const origWarn = console.warn;
        console.warn = function(...args) {
          if (args.some(a => isBenignError(a && (a.message || String(a))))) return;
          origWarn.apply(console, args);
        };
      })();
    </script>

    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];

      // One-time Legacy Key Cleanup & Silent Service Worker Registration (NO automatic window.location.reload)
      (function() {
        var CLEANUP_VERSION_KEY = 'three_youths_pwa_cleanup_v21_stable';

        function cleanupLegacyKeysOnce() {
          try {
            if (localStorage.getItem(CLEANUP_VERSION_KEY) === 'done') {
              return;
            }
            var legacyKeys = [
              'three_youths_announcements_v1',
              'three_youths_announcements_v2',
              'three_youths_announcements_v3',
              'three_youths_announcements_v4'
            ];
            for (var i = 0; i < legacyKeys.length; i++) {
              localStorage.removeItem(legacyKeys[i]);
            }
            localStorage.setItem(CLEANUP_VERSION_KEY, 'done');
          } catch (e) {}
        }

        cleanupLegacyKeysOnce();

        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.getRegistration('/').then(function(existingReg) {
              if (!existingReg) {
                navigator.serviceWorker.register('/OneSignalSDKWorker.js?v=21', {
                  scope: '/',
                  updateViaCache: 'none'
                }).catch(function() {});
              }
            }).catch(function() {});
          });
        }
      })();
