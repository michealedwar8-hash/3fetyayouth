    <script>
      // Intercept any Vite HMR or legacy Supabase WebSocket creation, static API fallbacks, & suppress benign runtime warnings
      (function() {
        var OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          var PatchedWebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            var protoStr = String(protocols || '');
            if (
              protoStr.indexOf('vite-hmr') !== -1 ||
              protoStr.indexOf('vite-ping') !== -1 ||
              urlStr.indexOf(':24678') !== -1 ||
              urlStr.indexOf('token=') !== -1 ||
              urlStr.indexOf('supabase.co') !== -1
            ) {
              var dummy = {
                url: urlStr,
                readyState: 1,
                protocol: protoStr,
                extensions: '',
                bufferedAmount: 0,
                binaryType: 'blob',
                send: function() {},
                close: function() { this.readyState = 3; },
                addEventListener: function(type, cb) {
                  if (type === 'open' && typeof cb === 'function') {
                    setTimeout(function() { try { cb({ type: 'open', target: dummy }); } catch (e) {} }, 0);
                  }
                },
                removeEventListener: function() {},
                dispatchEvent: function() { return true; },
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null
              };
              setTimeout(function() {
                if (typeof dummy.onopen === 'function') {
                  try { dummy.onopen({ type: 'open', target: dummy }); } catch (e) {}
                }
              }, 0);
              return dummy;
            }
            return protocols !== undefined ? new OrigWebSocket(url, protocols) : new OrigWebSocket(url);
          };
          PatchedWebSocket.prototype = OrigWebSocket.prototype;
          PatchedWebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          PatchedWebSocket.OPEN = OrigWebSocket.OPEN;
          PatchedWebSocket.CLOSING = OrigWebSocket.CLOSING;
          PatchedWebSocket.CLOSED = OrigWebSocket.CLOSED;
          window.WebSocket = PatchedWebSocket;
        }

        // Prevent EventSource('/api/events') 404 on static custom domains (e.g. 3fetyayouth.online) where Cloudflare Durable Objects WS is used
        var isStaticCustomDomain = typeof location !== 'undefined' && (
          location.hostname.indexOf('3fetyayouth.online') !== -1 ||
          location.hostname.indexOf('.pages.dev') !== -1
        );
        if (isStaticCustomDomain && window.EventSource) {
          var OrigEventSource = window.EventSource;
          var PatchedEventSource = function(url, config) {
            var u = String(url || '');
            if (u.indexOf('/api/events') !== -1) {
              return {
                url: u,
                readyState: 1,
                withCredentials: false,
                close: function() { this.readyState = 2; },
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() { return true; },
                onopen: null,
                onmessage: null,
                onerror: null
              };
            }
            return new OrigEventSource(url, config);
          };
          PatchedEventSource.prototype = OrigEventSource.prototype;
          PatchedEventSource.CONNECTING = 0;
          PatchedEventSource.OPEN = 1;
          PatchedEventSource.CLOSED = 2;
          window.EventSource = PatchedEventSource;
        }

        // Intercept only legacy supabase.co fetches — NEVER intercept same-origin /api/* on 3fetyayouth.online
        // because https://3fetyayouth.online is served directly by the live Cloudflare Worker API!
        if (window.fetch) {
          var origFetch = window.fetch.bind(window);
          window.fetch = function(input, init) {
            var urlStr = typeof input === 'string' ? input : (input && input.url ? input.url : String(input || ''));
            if (urlStr.indexOf('supabase.co') !== -1) {
              return Promise.resolve(new Response(JSON.stringify([]), {
                status: 200,
                headers: { 'Content-Type': 'application/json' }
              }));
            }
            return origFetch(input, init);
          };
        }

        const extractErrorText = function(reason) {
          if (!reason) return '';
          if (typeof reason === 'string') return reason;
          if (reason.message) return String(reason.message);
          try {
            const parts = [];
            if (reason.name) parts.push(reason.name);
            if (reason.code) parts.push(reason.code);
            if (reason.status) parts.push(reason.status);
            if (reason.reason) parts.push(String(reason.reason));
            if (reason.error) parts.push(String(reason.error));
            const s = parts.join(' ');
            if (s.trim()) return s;
            return JSON.stringify(reason);
          } catch (e) {
            return String(reason);
          }
        };

        const isBenignError = function(msg, reasonObj) {
          const s = String(msg || '') + ' ' + (reasonObj ? extractErrorText(reasonObj) : '');
          const trimmed = s.trim();
          if (!trimmed) return false;
          // Suppress plain non-Error third-party SDK object rejections (e.g. OneSignal / Beacon)
          if (
            reasonObj &&
            typeof reasonObj === 'object' &&
            !(reasonObj instanceof Error) &&
            (trimmed === '{}' || s.indexOf('OneSignal') !== -1 || s.indexOf('PushSubscription') !== -1 || s.indexOf('indexedDB') !== -1 || reasonObj.isTrusted === false || typeof reasonObj.status !== 'undefined')
          ) {
            return true;
          }
          return trimmed.includes('WebSocket closed without opened') ||
                 trimmed.includes('failed to connect to websocket') ||
                 trimmed.includes('[vite] failed to connect') ||
                 trimmed.includes('Frame with ID 0 was removed') ||
                 trimmed.includes('IndexedDB timed out') ||
                 trimmed.includes('Invalid Refresh Token') ||
                 trimmed.includes('Refresh Token Not Found') ||
                 trimmed.includes('Lock broken by another request') ||
                 trimmed.includes('OneSignal') ||
                 trimmed.includes('ServiceWorker') ||
                 trimmed.includes('cloudflareinsights') ||
                 trimmed.includes('beacon.min.js') ||
                 trimmed.includes('Automatically scrolling cursor') ||
                 trimmed.includes('Fallback to REST API') ||
                 trimmed.includes('falling back to REST API') ||
                 trimmed.includes('Realtime send()') ||
                 trimmed.includes('supabase.co');
        };

        // One-time recovery when stale cached index.html references an outdated /assets/index-*.js chunk
        const recoverFromStaleChunkOnce = function() {
          try {
            const key = 'three_youths_chunk_recovery_ts';
            const last = Number(sessionStorage.getItem(key) || '0');
            if (Date.now() - last < 15000) return;
            sessionStorage.setItem(key, String(Date.now()));
            if ('caches' in window) {
              caches.keys().then(function(names) {
                return Promise.all(names.map(function(n) { return caches.delete(n); }));
              }).catch(function() {});
            }
            setTimeout(function() {
              try {
                const u = new URL(window.location.href);
                u.searchParams.set('_cb', String(Date.now()));
                window.location.replace(u.toString());
              } catch (e) {
                window.location.reload();
              }
            }, 80);
          } catch (e) {}
        };

        window.addEventListener('unhandledrejection', function(event) {
          const msg = extractErrorText(event.reason);
          if (
            isBenignError(msg, event.reason) ||
            (event.reason && typeof event.reason === 'object' && !(event.reason instanceof Error))
          ) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          const target = event && event.target;
          if (target && target.tagName === 'SCRIPT' && target.src && target.src.indexOf('/assets/') !== -1) {
            event.preventDefault();
            recoverFromStaleChunkOnce();
            return;
          }
          const msg = (event && (event.message || (event.error && event.error.message))) || '';
          const srcFile = (event && event.filename) || '';
          if (
            String(msg).includes("Unexpected token '<'") &&
            (srcFile.indexOf('/assets/') !== -1 || srcFile.indexOf('index-') !== -1)
          ) {
            event.preventDefault();
            recoverFromStaleChunkOnce();
            return;
          }
          if (isBenignError(msg, event && event.error)) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);

        const origError = console.error;
        console.error = function(...args) {
          if (args.some(a => isBenignError(extractErrorText(a), a))) return;
          origError.apply(console, args);
        };

        const origWarn = console.warn;
        console.warn = function(...args) {
          if (args.some(a => isBenignError(extractErrorText(a), a))) return;
          origWarn.apply(console, args);
        };
      })();
    </script>

    <script>

      // One-time Legacy Key Cleanup & Silent Service Worker Registration (NO automatic window.location.reload)
      (function() {
        var CLEANUP_VERSION_KEY = 'three_youths_pwa_cleanup_v31_perf_gender_fix';

        function cleanupLegacyKeysOnce() {
          try {
            if (localStorage.getItem(CLEANUP_VERSION_KEY) === 'done') {
              return;
            }
            var legacyKeys = [
              'three_youths_announcements_v1',
              'three_youths_announcements_v2',
              'three_youths_announcements_v3',
              'three_youths_announcements_v4'
            ];
            for (var i = 0; i < legacyKeys.length; i++) {
              localStorage.removeItem(legacyKeys[i]);
            }
            if ('caches' in window) {
              caches.keys().then(function(names) {
                return Promise.all(names.map(function(n) { return caches.delete(n); }));
              }).catch(function() {});
            }
            localStorage.setItem(CLEANUP_VERSION_KEY, 'done');
          } catch (e) {}
        }

        cleanupLegacyKeysOnce();

        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/OneSignalSDKWorker.js?v=31', {
              scope: '/',
              updateViaCache: 'none'
            }).then(function(reg) {
              if (reg && typeof reg.update === 'function') {
                reg.update().catch(function() {});
              }
            }).catch(function() {});
          });
        }
      })();
