name = "3fetyayouth"
main = "src/worker.js"
compatibility_date = "2026-11-04"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws"]

[[d1_databases]]
binding = "DB"
database_name = "threefetyayouth"
database_id = "1d13778e-f840-482d-b1e9-02dda36fc9e3"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "threefetyayouth-media"

[vars]
VITE_APP_URL = "https://3fetyayouth.online"
CLOUDFLARE_WORKER_URL = "https://threefetyayouth-api.michealedwar8.workers.dev"
